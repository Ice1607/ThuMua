<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriTrade Pro - Quản Lý Thu Mua Nông Sản</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <!-- PWA Manifest & Meta -->
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json;base64,ewogy25hbWUiOiAiQWdyaVRyYWRlIFBybyIsCiAic2hvcnRfbmFtZSI6ICJBZ3JpVHJhZGUiLAogInN0YXJ0X3VybCI6ICIvIiwKICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogImJhY2tncm91bmRfY29sb3IiOiAiI2VjZmRmNSIsCiAidGhlbWVfY29sb3IiOiAiIzA1OTY2OSIsCiAiaWNvbnMiOiBbXQp9">

    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        /* Custom Print Styles */
        @media print {
            body * { visibility: hidden; }
            #printable-invoice, #printable-invoice * { visibility: visible; }
            #printable-invoice { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white" x-data="appState()">

    <!-- Toast Notification Banner -->
    <div class="fixed top-4 right-4 z-50 space-y-2 max-w-sm w-full px-4 pointer-events-none">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-transition:enter="transition transform ease-out duration-300"
                 x-transition:enter-start="translate-y-2 opacity-0 scale-95"
                 x-transition:enter-end="translate-y-0 opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-end="opacity-0 scale-95"
                 class="pointer-events-auto flex items-center p-4 rounded-xl shadow-lg border backdrop-blur-md"
                 :class="{
                    'bg-emerald-50/90 border-emerald-200 text-emerald-900': toast.type === 'success',
                    'bg-rose-50/90 border-rose-200 text-rose-900': toast.type === 'error',
                    'bg-sky-50/90 border-sky-200 text-sky-900': toast.type === 'info'
                 }">
                <i class="fas mr-3 text-lg" :class="{
                    'fa-check-circle text-emerald-600': toast.type === 'success',
                    'fa-exclamation-circle text-rose-600': toast.type === 'error',
                    'fa-info-circle text-sky-600': toast.type === 'info'
                }"></i>
                <div class="flex-1 text-sm font-medium" x-text="toast.message"></div>
                <button @click="removeToast(toast.id)" class="ml-2 opacity-60 hover:opacity-150"><i class="fas fa-times"></i></button>
            </div>
        </template>
    </div>

    <!-- ==================== 1. AUTH SCREEN (LOGIN / SIGNUP) ==================== -->
    <template x-if="!currentUser">
        <div class="flex-1 flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-brand-700 via-brand-800 to-emerald-900 overflow-y-auto">
            <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 w-full max-w-md p-6 sm:p-8 my-auto">
                
                <!-- App Logo & Header -->
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-600 text-white rounded-2xl shadow-lg shadow-brand-600/30 mb-3 text-2xl font-bold">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900">AgriTrade Pro</h1>
                    <p class="text-xs text-gray-500 mt-1">Hệ Thống Quản Lý & Thu Mua Nông Sản Hiện Đại</p>
                </div>

                <!-- Mode Switcher: Login / Register -->
                <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
                    <button @click="authMode = 'login'" :class="authMode === 'login' ? 'bg-white shadow text-brand-700 font-semibold' : 'text-gray-500 hover:text-gray-800'" class="flex-1 py-2 text-sm rounded-lg transition-all">Đăng Nhập</button>
                    <button @click="authMode = 'register'" :class="authMode === 'register' ? 'bg-white shadow text-brand-700 font-semibold' : 'text-gray-500 hover:text-gray-800'" class="flex-1 py-2 text-sm rounded-lg transition-all">Đăng Ký</button>
                </div>

                <!-- ==================== LOGIN FORM ==================== -->
                <form x-show="authMode === 'login'" @submit.prevent="handleLogin" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Số Điện Thoại</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-phone"></i></span>
                            <input type="text" x-model="loginForm.phone" placeholder="Nhập số điện thoại (ví dụ: 0901234567)" required
                                   class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mật Khẩu</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400"><i class="fas fa-lock"></i></span>
                            <input type="password" x-model="loginForm.password" placeholder="Nhập mật khẩu" required
                                   class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600 focus:bg-white transition-all">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center space-x-2">
                        <span>Đăng Nhập Hệ Thống</span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>

                    <!-- Quick Demo Credentials Hint -->
                    <div class="mt-4 p-3 bg-brand-50 border border-emerald-100 rounded-xl text-xs text-brand-900 space-y-1">
                        <p class="font-bold"><i class="fas fa-info-circle mr-1"></i> Tài khoản mẫu dùng thử:</p>
                        <p>👑 <b>Admin:</b> 0901234567 | Mật khẩu: 123456</p>
                        <p>👤 <b>Khách:</b> 0987654321 | Mật khẩu: 123456</p>
                    </div>
                </form>

                <!-- ==================== REGISTER FORM ==================== -->
                <form x-show="authMode === 'register'" @submit.prevent="handleRegister" class="space-y-4">
                    <!-- Role Selector -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Phân Quyền Đăng Ký</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" @click="regRole = 'customer'" :class="regRole === 'customer' ? 'border-brand-600 bg-brand-50 text-brand-700 font-bold' : 'border-gray-200 text-gray-600'" class="p-2.5 border rounded-xl text-xs flex items-center justify-center space-x-2 transition-all">
                                <i class="fas fa-user"></i><span>Khách Hàng</span>
                            </button>
                            <button type="button" @click="regRole = 'admin'" :class="regRole === 'admin' ? 'border-brand-600 bg-brand-50 text-brand-700 font-bold' : 'border-gray-200 text-gray-600'" class="p-2.5 border rounded-xl text-xs flex items-center justify-center space-x-2 transition-all">
                                <i class="fas fa-user-shield"></i><span>Admin</span>
                            </button>
                        </div>
                    </div>

                    <!-- Admin Specific: Store Name -->
                    <template x-if="regRole === 'admin'">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Tên Cửa Hàng / Vựa Thu Mua</label>
                            <input type="text" x-model="regForm.storeName" placeholder="Ví dụ: Vựa Nông Sản Miền Tây" required
                                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                        </div>
                    </template>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Họ và Tên</label>
                        <input type="text" x-model="regForm.fullName" placeholder="Ví dụ: Nguyễn Văn A" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Số Điện Thoại (Dùng để đăng nhập)</label>
                        <input type="text" x-model="regForm.phone" placeholder="Ví dụ: 0912345678" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Năm Sinh</label>
                            <input type="number" x-model.number="regForm.birthYear" @input="regForm.age = new Date().getFullYear() - regForm.birthYear" placeholder="1990" required min="1900" max="2024"
                                   class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Tuổi (Tự động)</label>
                            <input type="text" :value="regForm.birthYear ? (new Date().getFullYear() - regForm.birthYear) : ''" disabled placeholder="Tự động tính"
                                   class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm text-gray-500 cursor-not-allowed">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Ảnh Đại Diện (URL Hình ảnh)</label>
                        <input type="text" x-model="regForm.avatar" placeholder="https://images.unsplash.com/..." 
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mật Khẩu</label>
                        <input type="password" x-model="regForm.password" placeholder="Tạo mật khẩu đăng nhập" required
                               class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-brand-600">
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center space-x-2">
                        <span>Hoàn Tất Đăng Ký</span>
                        <i class="fas fa-check text-xs"></i>
                    </button>
                </form>

            </div>
        </div>
    </template>

    <!-- ==================== 2. MAIN APP DASHBOARD ==================== -->
    <template x-if="currentUser">
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- Top Navigation Header -->
            <header class="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shrink-0 z-20">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold shadow-md shadow-brand-500/20 overflow-hidden">
                        <img :src="currentUser.avatar || 'https://placehold.co/100x100/10b981/ffffff?text=' + currentUser.fullName.charAt(0)" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100/10b981/ffffff?text=U'">
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <h2 class="text-sm font-bold text-gray-900" x-text="currentUser.fullName"></h2>
                            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full uppercase" :class="currentUser.role === 'admin' ? 'bg-amber-100 text-amber-800' : 'bg-brand-100 text-brand-800'" x-text="currentUser.role === 'admin' ? 'Admin (' + (currentUser.storeName || 'Vựa') + ')' : 'Khách Hàng'"></span>
                        </div>
                        <p class="text-xs text-gray-500" x-text="'SĐT: ' + currentUser.phone"></p>
                    </div>
                </div>

                <!-- Right Action Buttons -->
                <div class="flex items-center space-x-2">
                    <!-- Quick Customer Call & Zalo for Customers -->
                    <template x-if="currentUser.role === 'customer'">
                        <div class="flex items-center space-x-2">
                            <a :href="'tel:' + adminInfo.phone" class="flex items-center space-x-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition-all">
                                <i class="fas fa-phone-alt"></i>
                                <span class="hidden sm:inline">Gọi Admin</span>
                            </a>
                            <a :href="'https://zalo.me/' + adminInfo.phone" target="_blank" class="flex items-center space-x-1 bg-sky-500 hover:bg-sky-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition-all">
                                <i class="fa-solid fa-comment-sms"></i>
                                <span class="hidden sm:inline">Zalo Admin</span>
                            </a>
                        </div>
                    </template>

                    <!-- Logout Button -->
                    <button @click="logout" title="Đăng xuất" class="p-2 text-gray-400 hover:text-rose-600 rounded-xl hover:bg-rose-50 transition-all">
                        <i class="fas fa-sign-out-alt text-lg"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content Area with Tabs -->
            <main class="flex-1 overflow-y-auto bg-gray-50 pb-20 sm:pb-6">
                
                <!-- ==================== TAB 1: HOME / DASHBOARD ==================== -->
                <div x-show="activeTab === 'home'" class="p-4 sm:p-6 max-w-6xl mx-auto space-y-6">
                    <!-- Welcome Banner -->
                    <div class="bg-gradient-to-r from-brand-600 to-emerald-800 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
                        <div class="absolute right-0 bottom-0 translate-x-6 translate-y-6 opacity-10 text-9xl">
                            <i class="fas fa-leaf"></i>
                        </div>
                        <div class="relative z-10">
                            <span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-medium uppercase tracking-wider">Xin chào, <span x-text="currentUser.fullName"></span>!</span>
                            <h2 class="text-2xl sm:text-3xl font-extrabold mt-2" x-text="currentUser.role === 'admin' ? (currentUser.storeName || 'Hệ Thống Thu Mua Nông Sản') : 'Khu Vực Khách Hàng Thân Thiết'"></h2>
                            <p class="text-sm text-brand-100 mt-1 max-w-xl" x-text="currentUser.role === 'admin' ? 'Quản lý thu mua, lập hóa đơn, theo dõi khách hàng và thông báo hàng ngày dễ dàng.' : 'Tra cứu hóa đơn mua bán nông sản, cập nhật thông tin cá nhân và liên hệ vựa thu mua nhanh chóng.'"></p>
                            
                            <!-- Admin Quick Action -->
                            <template x-if="currentUser.role === 'admin'">
                                <div class="mt-4 flex flex-wrap gap-3">
                                    <button @click="activeTab = 'invoices'; openCreateInvoiceModal()" class="px-4 py-2 bg-white text-brand-800 rounded-xl text-xs font-bold shadow hover:bg-brand-50 transition-all flex items-center space-x-2">
                                        <i class="fas fa-file-invoice-dollar text-brand-600"></i>
                                        <span>+ Lập Hóa Đơn Mới</span>
                                    </button>
                                    <button @click="activeTab = 'notifications'" class="px-4 py-2 bg-brand-700/80 text-white rounded-xl text-xs font-bold shadow hover:bg-brand-700 transition-all flex items-center space-x-2">
                                        <i class="fas fa-bullhorn"></i>
                                        <span>Đăng Thông Báo Mới</span>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Statistics Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold">
                                <i class="fas fa-file-invoice"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 font-medium">Tổng Hóa Đơn</p>
                                <h3 class="text-xl font-bold text-gray-900 mt-0.5" x-text="filteredInvoices.length"></h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-sky-100 text-sky-600 rounded-xl flex items-center justify-center text-xl font-bold">
                                <i class="fas fa-weight-scale"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 font-medium">Tổng Khối Lượng (KG)</p>
                                <h3 class="text-xl font-bold text-gray-900 mt-0.5" x-text="totalKgFiltered + ' kg'"></h3>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-4">
                            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-xl font-bold">
                                <i class="fas fa-coins"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 font-medium">Tổng Giá Trị (VNĐ)</p>
                                <h3 class="text-xl font-bold text-gray-900 mt-0.5" x-text="formatMoney(totalAmountFiltered)"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Notifications Widget -->
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-sm font-bold text-gray-900 flex items-center space-x-2">
                                <i class="fas fa-bell text-brand-600"></i>
                                <span>Thông Báo Mới Nhất</span>
                            </h3>
                            <button @click="activeTab = 'notifications'" class="text-xs text-brand-600 font-semibold hover:underline">Xem tất cả</button>
                        </div>
                        <div class="space-y-3">
                            <template x-for="notif in notifications.slice(0, 3)" :key="notif.id">
                                <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 flex items-start space-x-3">
                                    <div class="w-8 h-8 rounded-lg bg-brand-100 text-brand-700 flex items-center justify-center shrink-0 mt-0.5">
                                        <i class="fas fa-bullhorn text-xs"></i>
                                    </div>
                                    <div class="flex-1">
                                        <div class="flex items-center justify-between">
                                            <h4 class="text-xs font-bold text-gray-900" x-text="notif.title"></h4>
                                            <span class="text-[10px] text-gray-400" x-text="notif.date"></span>
                                        </div>
                                        <p class="text-xs text-gray-600 mt-1" x-text="notif.content"></p>
                                    </div>
                                </div>
                            </template>
                            <template x-if="notifications.length === 0">
                                <p class="text-xs text-gray-400 text-center py-4">Chưa có thông báo nào.</p>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ==================== TAB 2: INVOICES (HÓA ĐƠN) ==================== -->
                <div x-show="activeTab === 'invoices'" class="p-4 sm:p-6 max-w-6xl mx-auto space-y-6" x-cloak>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-gray-900">Quản Lý Hóa Đơn Thu Mua</h2>
                            <p class="text-xs text-gray-500" x-text="currentUser.role === 'admin' ? 'Danh sách toàn bộ hóa đơn của tất cả khách hàng' : 'Danh sách hóa đơn mua bán của riêng bạn'"></p>
                        </div>
                        <template x-if="currentUser.role === 'admin'">
                            <button @click="openCreateInvoiceModal()" class="px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-brand-600/30 transition-all flex items-center space-x-2">
                                <i class="fas fa-plus"></i>
                                <span>Lập Hóa Đơn Mới</span>
                            </button>
                        </template>
                    </div>

                    <!-- Invoices List Table / Cards -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-100 text-[11px] font-bold text-gray-500 uppercase tracking-wider">
                                        <th class="p-4">Mã HĐ / Ngày</th>
                                        <th class="p-4">Khách Hàng</th>
                                        <th class="p-4">Số Điện Thoại</th>
                                        <th class="p-4">Nông Sản Mua</th>
                                        <th class="p-4 text-right">Thành Tiền</th>
                                        <th class="p-4 text-center">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 text-xs">
                                    <template x-for="inv in filteredInvoices" :key="inv.id">
                                        <tr class="hover:bg-gray-50/80 transition-all">
                                            <td class="p-4 font-medium">
                                                <div class="font-bold text-brand-700" x-text="'#' + inv.id"></div>
                                                <div class="text-[10px] text-gray-400" x-text="inv.date"></div>
                                            </td>
                                            <td class="p-4 font-semibold text-gray-900" x-text="inv.customerName"></td>
                                            <td class="p-4 text-gray-600" x-text="inv.customerPhone"></td>
                                            <td class="p-4">
                                                <div class="space-y-0.5">
                                                    <template x-for="item in inv.items">

                    <div>
                        <p class="text-gray-500">Khách hàng: <strong class="text-gray-900" x-text="activeInvoice.customerName"></strong></p>
                        <p class="text-gray-500 mt-1">Số điện thoại: <strong class="text-gray-900" x-text="activeInvoice.customerPhone"></strong></p>
                    </div>
                </div>

                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b text-gray-500 font-bold">
                            <th class="py-2">STT</th>
                            <th class="py-2">Loại</th>
                            <th class="py-2 text-center">Giá (đ)</th>
                            <th class="py-2 text-center">KG</th>
                            <th class="py-2 text-right">Tổng (đ)</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <template x-for="(item, idx) in activeInvoice.items" :key="idx">
                            <tr>
                                <td class="py-2 text-gray-500" x-text="idx + 1"></td>
                                <td class="py-2 font-medium text-gray-900" x-text="item.type"></td>
                                <td class="py-2 text-center text-gray-600" x-text="formatMoney(item.price)"></td>
                                <td class="py-2 text-center text-gray-600" x-text="item.kg"></td>
                                <td class="py-2 text-right font-bold text-gray-900" x-text="formatMoney(item.price * item.kg)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div class="border-t pt-4 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-400">Người lập hóa đơn (Admin):</p>
                        <p class="text-xs font-bold text-gray-800" x-text="activeInvoice.adminName"></p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-gray-500">Thành Tiền:</span>
                        <div class="text-xl font-extrabold text-brand-700" x-text="formatMoney(activeInvoice.grandTotal)"></div>
                    </div>
                </div>
            </div>

            <!-- Modal Actions -->
            <div class="flex items-center justify-between pt-2">
                <button @click="showDetailModal = false" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-xs font-bold">Đóng</button>
                <div class="flex items-center space-x-2">
                    <button @click="exportExcel(activeInvoice)" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow flex items-center space-x-1.5">
                        <i class="fas fa-file-excel"></i><span>Excel</span>
                    </button>
                    <button @click="exportNote(activeInvoice)" class="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow flex items-center space-x-1.5">
                        <i class="fas fa-file-lines"></i><span>Note</span>
                    </button>
                    <button @click="printReceipt(activeInvoice)" class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold shadow flex items-center space-x-1.5">
                        <i class="fas fa-print"></i><span>In Máy In</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Notification Modal (Admin CRUD) -->
    <div x-show="showNotifModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div @click.outside="showNotifModal = false" class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-6">
            <h3 class="text-lg font-bold text-gray-900" x-text="notifForm.id ? 'Chỉnh Sửa Thông Báo' : 'Thêm Thông Báo Hàng Ngày'"></h3>
            <form @submit.prevent="saveNotification" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tiêu Đề Thông Báo</label>
                    <input type="text" x-model="notifForm.title" placeholder="Ví dụ: Giá thu mua mít hôm nay..." required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Nội Dung Chi Tiết</label>
                    <textarea x-model="notifForm.content" rows="4" placeholder="Nhập nội dung thông báo..." required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" @click="showNotifModal = false" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-bold">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">Lưu Thông Báo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 4. Add/Edit Customer Modal (Admin Customer Management) -->
    <div x-show="showCustomerModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div @click.outside="showCustomerModal = false" class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 space-y-6">
            <h3 class="text-lg font-bold text-gray-900" x-text="customerForm.isEdit ? 'Chỉnh Sửa Khách Hàng' : 'Thêm Khách Hàng Mới'"></h3>
            <form @submit.prevent="saveCustomer" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Họ và Tên</label>
                    <input type="text" x-model="customerForm.fullName" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Số Điện Thoại</label>
                    <input type="text" x-model="customerForm.phone" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Năm Sinh</label>
                        <input type="number" x-model.number="customerForm.birthYear" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">CCCD</label>
                        <input type="text" x-model="customerForm.cccd" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mật Khẩu Đăng Nhập</label>
                    <input type="text" x-model="customerForm.password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Ảnh Đại Diện (URL)</label>
                    <input type="text" x-model="customerForm.avatar" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-brand-600">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" @click="showCustomerModal = false" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl text-xs font-bold">Hủy</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow">Lưu Khách Hàng</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== SCRIPT LOGIC ==================== -->
    <script>
        function appState() {
            return {
                // Auth & Session
                currentUser: JSON.parse(localStorage.getItem('agri_current_user')) || null,
                authMode: 'login',
                regRole: 'customer',
                activeTab: 'home',

                loginForm: { phone: '', password: '' },
                regForm: { storeName: '', fullName: '', phone: '', birthYear: 1995, age: 31, avatar: '', password: '' },

                // Data repositories stored in localStorage
                customers: JSON.parse(localStorage.getItem('agri_customers')) || [
                    { id: 'c1', fullName: 'Trần Văn Khách', phone: '0987654321', birthYear: 1990, cccd: '038090123456', password: '123456', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100' }
                ],
                adminInfo: JSON.parse(localStorage.getItem('agri_admin')) || {
                    fullName: 'Nguyễn Văn Admin',
                    storeName: 'Vựa Thu Mua Nông Sản Miền Tây',
                    phone: '0901234567',
                    avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100'
                },
                notifications: JSON.parse(localStorage.getItem('agri_notifications')) || [
                    { id: 1, title: 'Cập nhật giá Mít Nhất & Mít II', content: 'Hôm nay vựa thu mua Mít Nhất 22.000đ/kg, Mít Loại II 16.000đ/kg. Kính mời bà con ghé ủng hộ!', date: '30/10/2026' }
                ],
                invoices: JSON.parse(localStorage.getItem('agri_invoices')) || [
                    {
                        id: 'INV1001',
                        customerPhone: '0987654321',
                        customerName: 'Trần Văn Khách',
                        storeName: 'Vựa Thu Mua Nông Sản Miền Tây',
                        adminName: 'Nguyễn Văn Admin',
                        date: '30/10/2026 14:30',
                        items: [
                            { type: 'Mít Nhất', price: 20000, kg: 2 },
                            { type: 'Mít Loại II', price: 15000, kg: 3 }
                        ],
                        grandTotal: 85000
                    }
                ],

                // UI Modals state
                showInvoiceModal: false,
                showDetailModal: false,
                showNotifModal: false,
                showCustomerModal: false,

                invoiceForm: {
                    customerPhone: '',
                    date: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}),
                    items: [{ type: 'Mít Nhất', price: 20000, kg: 2 }]
                },
                activeInvoice: {},
                notifForm: { id: null, title: '', content: '' },
                customerForm: { isEdit: false, id: null, fullName: '', phone: '', birthYear: 1995, cccd: '', password: '', avatar: '' },
                profileForm: { fullName: '', phone: '', cccd: '', avatar: '' },
                settings: { notificationsEnabled: true },
                toasts: [],

                init() {
                    if (this.currentUser && this.currentUser.role === 'customer') {
                        this.profileForm = {
                            fullName: this.currentUser.fullName,
                            phone: this.currentUser.phone,
                            cccd: this.currentUser.cccd || '',
                            avatar: this.currentUser.avatar || ''
                        };
                    }
                },

                // Toast Notification helper
                showToast(message, type = 'success') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type });
                    setTimeout(() => { this.removeToast(id); }, 4000);
                },
                removeToast(id) {
                    this.toasts = this.toasts.filter(t => t.id !== id);
                },

                // Format Currency
                formatMoney(amount) {
                    return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
                },

                // Authentication Handlers
                handleLogin() {
                    // Check Admin
                    if (this.loginForm.phone === '0901234567' && this.loginForm.password === '123456') {
                        this.currentUser = { role: 'admin', fullName: this.adminInfo.fullName, storeName: this.adminInfo.storeName, phone: this.adminInfo.phone, avatar: this.adminInfo.avatar };
                        localStorage.setItem('agri_current_user', JSON.stringify(this.currentUser));
                        this.showToast('Đăng nhập thành công với tư cách Admin!');
                        return;
                    }

                    // Check Customer in list
                    const foundCust = this.customers.find(c => c.phone === this.loginForm.phone && c.password === this.loginForm.password);
                    if (foundCust) {
                        this.currentUser = { role: 'customer', ...foundCust };
                        localStorage.setItem('agri_current_user', JSON.stringify(this.currentUser));
                        this.profileForm = { fullName: foundCust.fullName, phone: foundCust.phone, cccd: foundCust.cccd || '', avatar: foundCust.avatar || '' };
                        this.showToast('Đăng nhập thành công!');
                        return;
                    }

                    this.showToast('Số điện thoại hoặc mật khẩu không chính xác!', 'error');
                },

                handleRegister() {
                    const age = new Date().getFullYear() - this.regForm.birthYear;
                    if (this.regRole === 'admin') {
                        this.adminInfo = {
                            fullName: this.regForm.fullName,
                            storeName: this.regForm.storeName,
                            phone: this.regForm.phone,
                            avatar: this.regForm.avatar || 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100'
                        };
                        localStorage.setItem('agri_admin', JSON.stringify(this.adminInfo));
                        this.showToast('Đăng ký tài khoản Admin thành công! Vui lòng đăng nhập.');
                        this.authMode = 'login';
                        this.loginForm.phone = this.regForm.phone;
                    } else {
                        const newCust = {
                            id: 'c_' + Date.now(),
                            fullName: this.regForm.fullName,
                            phone: this.regForm.phone,
                            birthYear: this.regForm.birthYear,
                            age: age,
                            password: this.regForm.password,
                            avatar: this.regForm.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100',
                            cccd: ''
                        };
                        this.customers.push(newCust);
                        localStorage.setItem('agri_customers', JSON.stringify(this.customers));
                        this.showToast('Đăng ký tài khoản Khách hàng thành công! Vui lòng đăng nhập.');
                        this.authMode = 'login';
                        this.loginForm.phone = this.regForm.phone;
                    }
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('agri_current_user');
                    this.showToast('Đã đăng xuất khỏi hệ thống.', 'info');
                },

                // Invoices Computed & Management
                get filteredInvoices() {
                    if (!this.currentUser) return [];
                    if (this.currentUser.role === 'admin') return this.invoices;
                    return this.invoices.filter(i => i.customerPhone === this.currentUser.phone);
                },

                get totalKgFiltered() {
                    return this.filteredInvoices.reduce((acc, inv) => acc + inv.items.reduce((sum, item) => sum + Number(item.kg), 0), 0);
                },

                get totalAmountFiltered() {
                    return this.filteredInvoices.reduce((acc, inv) => acc + inv.grandTotal, 0);
                },

                openCreateInvoiceModal() {
                    this.invoiceForm = {
                        customerPhone: '',
                        date: new Date().toLocaleDateString('vi-VN') + ' ' + new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'}),
                        items: [{ type: 'Mít Nhất', price: 20000, kg: 2 }]
                    };
                    this.showInvoiceModal = true;
                },

                addInvoiceItem() {
                    this.invoiceForm.items.push({ type: '', price: 0, kg: 1 });
                },

                removeInvoiceItem(index) {
                    if (this.invoiceForm.items.length > 1) {
                        this.invoiceForm.items.splice(index, 1);
                    } else {
                        this.showToast('Hóa đơn phải có ít nhất 1 mặt hàng!', 'error');
                    }
                },

                onSelectCustomer(e) {
                    // Utility when selecting customer in invoice creation
                },

                calculateGrandTotal() {
                    return this.invoiceForm.items.reduce((sum, item) => sum + (item.price * item.kg), 0);
                },

                saveInvoice() {
                    const cust = this.customers.find(c => c.phone === this.invoiceForm.customerPhone);
                    const newInv = {
                        id: 'INV' + Math.floor(1000 + Math.random() * 9000),
                        customerPhone: this.invoiceForm.customerPhone,
                        customerName: cust ? cust.fullName : 'Khách lẻ',
                        storeName: (this.currentUser && this.currentUser.storeName) || this.adminInfo.storeName,
                        adminName: (this.currentUser && this.currentUser.fullName) || this.adminInfo.fullName,
                        date: this.invoiceForm.date,
                        items: [...this.invoiceForm.items],
                        grandTotal: this.calculateGrandTotal()
                    };
                    this.invoices.unshift(newInv);
                    localStorage.setItem('agri_invoices', JSON.stringify(this.invoices));
                    this.showInvoiceModal = false;
                    this.showToast('Lập hóa đơn thành công! Đã gửi vào tài khoản khách hàng.');
                },

                viewInvoiceDetail(inv) {
                    this.activeInvoice = inv;
                    this.showDetailModal = true;
                },

                // Export Options: Excel (CSV), Note (Text), Print
                exportExcel(inv) {
                    let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
                    csvContent += "Ma HD,Ngay,Khach Hang,SDT,Loai Nong San,Gia (VND),So Luong (KG),Thanh Tien (VND)\n";
                    inv.items.forEach(item => {
                        csvContent += `"${inv.id}","${inv.date}","${inv.customerName}","${inv.customerPhone}","${item.type}",${item.price},${item.kg},${item.price * item.kg}\n`;
                    });
                    csvContent += `,,, , , Tong Cong,${inv.grandTotal}\n`;

                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `HoaDon_${inv.id}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    this.showToast('Đã xuất file Excel (CSV) thành công!');
                },

                exportNote(inv) {
                    let text = `--- HOA DON THU MUA ---\n`;
                    text += `Vựa: ${inv.storeName || 'AgriTrade'}\n`;
                    text += `Mã HĐ: #${inv.id} | Ngày: ${inv.date}\n`;
                    text += `Khách hàng: ${inv.customerName} (${inv.customerPhone})\n`;
                    text += `---------------------------------\n`;
                    inv.items.forEach((item, idx) => {
                        text += `${idx + 1}. ${item.type} - ${item.kg} kg x ${this.formatMoney(item.price)} = ${this.formatMoney(item.price * item.kg)}\n`;
                    });
                    text += `---------------------------------\n`;
                    text += `TỔNG TIỀN: ${this.formatMoney(inv.grandTotal)}\n`;
                    text += `Admin lập: ${inv.adminName}\n`;

                    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `HoaDon_${inv.id}.txt`;
                    link.click();
                    this.showToast('Đã xuất hóa đơn dạng Note thành công!');
                },

                printReceipt(inv) {
                    this.activeInvoice = inv;
                    this.showDetailModal = true;
                    setTimeout(() => {
                        window.print();
                    }, 300);
                },

                // Notification Management
                openNotificationModal() {
                    this.notifForm = { id: null, title: '', content: '' };
                    this.showNotifModal = true;
                },
                editNotification(notif) {
                    this.notifForm = { ...notif };
                    this.showNotifModal = true;
                },
                saveNotification() {
                    if (this.notifForm.id) {
                        const idx = this.notifications.findIndex(n => n.id === this.notifForm.id);
                        if (idx !== -1) this.notifications[idx] = { ...this.notifForm, date: new Date().toLocaleDateString('vi-VN') };
                        this.showToast('Cập nhật thông báo thành công!');
                    } else {
                        const newNotif = {
                            id: Date.now(),
                            title: this.notifForm.title,
                            content: this.notifForm.content,
                            date: new Date().toLocaleDateString('vi-VN')
                        };
                        this.notifications.unshift(newNotif);
                        this.showToast('Đăng thông báo mới thành công!');
                    }
                    localStorage.setItem('agri_notifications', JSON.stringify(this.notifications));
                    this.showNotifModal = false;
                },
                deleteNotification(id) {
                    this.notifications = this.notifications.filter(n => n.id !== id);
                    localStorage.setItem('agri_notifications', JSON.stringify(this.notifications));
                    this.showToast('Đã xóa thông báo.', 'info');
                },

                // Customer Management (Admin)
                openAddCustomerModal() {
                    this.customerForm = { isEdit: false, id: null, fullName: '', phone: '', birthYear: 1995, cccd: '', password: '123', avatar: '' };
                    this.showCustomerModal = true;
                },
                editCustomer(cust) {
                    this.customerForm = { isEdit: true, ...cust };
                    this.showCustomerModal = true;
                },
                saveCustomer() {
                    if (this.customerForm.isEdit) {
                        const idx = this.customers.findIndex(c => c.id === this.customerForm.id);
                        if (idx !== -1) {
                            this.customers[idx] = { ...this.customerForm, age: new Date().getFullYear() - this.customerForm.birthYear };
                        }
                        this.showToast('Cập nhật thông tin khách hàng thành công!');
                    } else {
                        const newCust = {
                            id: 'c_' + Date.now(),
                            ...this.customerForm,
                            age: new Date().getFullYear() - this.customerForm.birthYear,
                            avatar: this.customerForm.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'
                        };
                        this.customers.push(newCust);
                        this.showToast('Thêm khách hàng thành công!');
                    }
                    localStorage.setItem('agri_customers', JSON.stringify(this.customers));
                    this.showCustomerModal = false;
                },
                deleteCustomer(id) {
                    this.customers = this.customers.filter(c => c.id !== id);
                    localStorage.setItem('agri_customers', JSON.stringify(this.customers));
                    this.showToast('Đã xóa khách hàng.', 'info');
                },

                // Customer Profile Self Edit
                updateCustomerProfile() {
                    const idx = this.customers.findIndex(c => c.phone === this.currentUser.phone);
                    if (idx !== -1) {
                        this.customers[idx].fullName = this.profileForm.fullName;
                        this.customers[idx].phone = this.profileForm.phone;
                        this.customers[idx].cccd = this.profileForm.cccd;
                        this.customers[idx].avatar = this.profileForm.avatar;
                        localStorage.setItem('agri_customers', JSON.stringify(this.customers));
                    }
                    this.currentUser.fullName = this.profileForm.fullName;
                    this.currentUser.phone = this.profileForm.phone;
                    this.currentUser.cccd = this.profileForm.cccd;
                    this.currentUser.avatar = this.profileForm.avatar;
                    localStorage.setItem('agri_current_user', JSON.stringify(this.currentUser));
                    this.showToast('Cập nhật hồ sơ cá nhân thành công!');
                },

                toggleNotifications() {
                    this.showToast(this.settings.notificationsEnabled ? 'Đã bật thông báo đẩy.' : 'Đã tắt thông báo đẩy.', 'info');
                }
            }
        }
    </script>
</body>
</html>
